[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pzelvin-cardduty"
version = "0.1.0"
description = "在同一个输入里两两比对，检测模型卡的更新责任相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pzelvin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pzelvin.github.io"
Repository = "https://github.com/pzelvin/cardduty"
Issues = "https://github.com/pzelvin/cardduty/issues"

[project.scripts]
cardduty = "cardduty:main"

[tool.setuptools]
py-modules = ["cardduty"]
